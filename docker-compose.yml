services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/notifications
      REDIS_URL: redis://redis:6379
      RUN_WORKERS: "true"
      SIMULATED_FAILURE_RATE: "0.08"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./public:/app/public

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/notifications
      REDIS_URL: redis://redis:6379
      RUN_WORKERS: "false"
      SIMULATED_FAILURE_RATE: "0.08"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - split-workers

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
